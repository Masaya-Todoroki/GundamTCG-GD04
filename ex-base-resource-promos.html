<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EX Base / Resource Promos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{background:#1b1b1b;border-bottom:1px solid #333;padding:20px;text-align:center}
h1{margin:0}
p{color:#ccc}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.nav-btn{padding:10px 18px;border-radius:999px;background:#292929;color:#fff;
border:1px solid #444;text-decoration:none;font-weight:bold}
.nav-btn:hover{background:#3b3b3b}
main{padding:30px 3%}
.section-title{text-align:center;margin:40px 0 20px;font-size:2rem}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:16px;
max-width:1600px;
margin:auto;
}
.card{
background:#1b1b1b;
border:1px solid #333;
border-radius:12px;
overflow:hidden;
transition:.15s;
}
.card:hover{transform:translateY(-3px);border-color:#666}
.card img{
display:block;
width:100%;
height:auto;
cursor:pointer;
}
.viewer{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.92);
padding:20px;
z-index:1000;
}
.viewer.open{display:flex}
.viewer img{
max-width:92vw;
max-height:92vh;
border-radius:10px;
}
.close{
position:fixed;
top:15px;
right:25px;
font-size:48px;
color:white;
cursor:pointer;
user-select:none;
}
@media(max-width:600px){
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}
</style>
</head>
<body>

<header>
<h1>EX Base / Resource Promos</h1>
<p>Promotional EX Bases, EX Resources and Resource cards.</p>

<nav>
<a class="nav-btn" href="https://masayatodoroki.com">Home</a>
</nav>
</header>

<main id="content"></main>

<div id="viewer" class="viewer">
<div class="close">&times;</div>
<img id="viewerImg">
</div>

<script>

const promoSets = [
{
title:"EX Base Promos",
folder:"EXBP",
prefix:"EXBP",
amount:27
},
{
title:"EX Resource Promos",
folder:"EXRP",
prefix:"EXRP",
amount:0
},
{
title:"Resource Promos",
folder:"RP",
prefix:"RP",
amount:0
}
];

//====================================================

const root="images";

const content=document.getElementById("content");

function createSection(set){

let html=`
<h2 class="section-title">${set.title}</h2>
<div class="grid">
`;

for(let i=1;i<=set.amount;i++){

let number=String(i).padStart(3,"0");
let id=`${set.prefix}-${number}`;
let path=`${root}/${set.folder}/${id}.png`;

html+=`
<div class="card">
<img
src="${path}"
alt="${id}"
loading="lazy"
width="500"
height="700">
</div>
`;
}

html+="</div>";

return html;
}

promoSets.forEach(set=>{
content.innerHTML+=createSection(set);
});

//====================================================
// Lightbox
//====================================================

const viewer=document.getElementById("viewer");
const viewerImg=document.getElementById("viewerImg");

document.querySelectorAll(".card img").forEach(img=>{

img.addEventListener("click",()=>{

viewerImg.src=img.src;
viewer.classList.add("open");
document.body.style.overflow="hidden";

});

});

function closeViewer(){

viewer.classList.remove("open");
viewerImg.src="";
document.body.style.overflow="";

}

document.querySelector(".close").onclick=closeViewer;

viewer.onclick=e=>{
if(e.target===viewer) closeViewer();
};

document.addEventListener("keydown",e=>{
if(e.key==="Escape") closeViewer();
});

</script>

</body>
</html>
