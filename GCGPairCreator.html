<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GCG Pair Creator v1.1</title>
<style>
* { box-sizing: border-box; }
:root {
    --gap: 16px;
    --panel: rgba(235,235,235,.42);
    --panel-border: rgba(90,90,90,.25);
    --control-bg: rgba(255,255,255,.94);
    --text: #333;
    --card-ratio: 63 / 88;
}
html, body { width:100%; height:100%; margin:0; overflow:hidden; }
body {
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
      linear-gradient(115deg, rgba(255,255,255,.58) 0 9%, transparent 9% 26%, rgba(255,255,255,.48) 26% 32%, transparent 32% 61%, rgba(255,255,255,.42) 61% 69%, transparent 69%),
      linear-gradient(65deg, transparent 0 18%, rgba(0,210,210,.16) 18% 38%, transparent 38% 62%, rgba(0,180,210,.15) 62% 76%, transparent 76%),
      #72e5e7;
    background-attachment: fixed;
}
button, select, input { font: inherit; }
.version-badge {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    z-index: 3000;
    padding: 5px 9px;
    border: 1px solid rgba(80,80,80,.35);
    border-radius: 7px;
    background: rgba(255,255,255,.88);
    color: #555;
    font-size: 12px;
    line-height: 1;
    pointer-events: none;
}
.hidden { display:none !important; }

#password-screen {
    width:100%;
    height:100vh;
    height:100dvh;
    display:grid;
    place-items:center;
    padding:24px;
}
.login-panel {
    width:min(430px,100%);
    padding:28px;
    border:1px solid rgba(70,70,70,.35);
    border-radius:16px;
    background:rgba(255,255,255,.94);
    box-shadow:0 16px 45px rgba(0,0,0,.18);
}
.login-panel h1 { margin:0 0 10px; text-align:center; font-size:1.8rem; }
.login-panel p { margin:0 0 20px; text-align:center; color:#666; }
.password-row { display:flex; gap:10px; }
#password-input {
    flex:1; min-width:0; padding:12px 14px;
    border:1px solid #aaa; border-radius:9px; background:#fff;
}
.primary-button {
    padding:11px 18px; border:1px solid #777; border-radius:9px;
    background:#fff; color:#333; cursor:pointer;
}
.primary-button:hover { background:#f3f3f3; }
.primary-button:disabled { opacity:.45; cursor:not-allowed; }
#password-message { min-height:1.2em; margin-top:12px; text-align:center; color:#a33; font-size:.9rem; }

#app {
    width:100%;
    height:100vh;
    height:100dvh;
    padding:14px;
    overflow:hidden;
}
.app-layout {
    width:100%; height:100%; min-height:0;
    display:grid;
    grid-template-columns:270px minmax(0,1fr);
    gap:var(--gap);
}
.sidebar {
    min-width:0; min-height:0; height:100%;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) minmax(0,1fr) auto;
    gap:var(--gap);
}
.set-select {
    width:100%; height:48px; padding:0 14px;
    border:1px solid #777; border-radius:8px;
    background:var(--control-bg); color:#444; font-size:1.15rem;
}
.selected-card {
    width:auto; height:100%; max-width:100%; min-height:0;
    aspect-ratio:var(--card-ratio); justify-self:center;
    display:grid; place-items:center; overflow:hidden;
    border:1px solid rgba(120,120,120,.4); border-radius:11px;
    background:rgba(255,255,255,.93); box-shadow:0 2px 4px rgba(0,0,0,.08);
}
.selected-card img {
    width:100%; height:100%; display:block; object-fit:contain;
    user-select:none; -webkit-user-drag:none;
}
.create-button {
    width:100%; height:52px; padding:0 14px;
    border:1px solid #777; border-radius:8px;
    background:var(--control-bg); color:#333; font-size:1.45rem; cursor:pointer;
}
.create-button:hover { background:#fff; }
.create-button:disabled { opacity:.5; cursor:not-allowed; }

.main-panel {
    min-width:0; min-height:0; height:100%;
    display:flex; flex-direction:column;
    padding:10px; overflow:hidden;
    border:1px solid var(--panel-border); border-radius:6px; background:var(--panel);
}
.top-row { flex:0 0 auto; min-height:24px; margin-bottom:6px; }
.status { min-height:1.2em; color:#555; font-size:.9rem; }
.card-grid {
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
    gap:16px;
    align-content:start;
    padding-right:4px;
    overflow-y:auto;
    overflow-x:hidden;
    cursor:grab;
    user-select:none;
    scrollbar-gutter:stable;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
}
.card-grid.dragging { cursor:grabbing; }
.card-button {
    position:relative;
    display:block;
    width:100%;
    height:auto;
    padding:0;
    margin:0;
    border:0;
    border-radius:12px;
    overflow:hidden;
    background:transparent;
    cursor:pointer;
}
.card-button img {
    display:block;
    width:100%;
    height:auto;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
}
.card-button:hover { transform:translateY(-2px); }
.card-button.selected-1::after,
.card-button.selected-2::after {
    content:""; position:absolute; inset:0; border:4px solid; pointer-events:none;
}
.card-button.selected-1::after { border-color:#3678ff; }
.card-button.selected-2::after { border-color:#ff8b36; }
.empty-state { padding:30px; text-align:center; color:#666; }

@media (max-width:1350px) and (min-aspect-ratio:1/1) {
    .app-layout { grid-template-columns:230px minmax(0,1fr); }
}
@media (max-width:1050px) and (min-aspect-ratio:1/1) {
    .app-layout { grid-template-columns:200px minmax(0,1fr); }
}

/* Portrait / tall screens: controls move above gallery */
@media (max-aspect-ratio:4/5) {
    #app {
        padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    }
    .app-layout {
        display:grid;
        grid-template-columns:1fr;
        grid-template-rows:auto minmax(0,1fr);
        gap:10px;
    }
    .sidebar {
        height:auto; min-height:0;
        display:grid;
        grid-template-columns:1fr 1fr;
        grid-template-rows:auto auto auto;
        gap:10px;
    }
    .set-select { grid-column:1/-1; height:46px; font-size:1rem; }
    .selected-card {
        width:auto;
        height:clamp(110px,18dvh,165px);
        max-width:100%;
        justify-self:center;
    }
    .create-button { grid-column:1/-1; height:48px; font-size:1.2rem; }
    .main-panel { width:100%; height:100%; min-height:0; padding:8px; }
    .top-row { min-height:20px; margin-bottom:5px; }
    .status { font-size:.82rem; }
    .card-grid { gap:10px; padding-right:2px; }
}

/* Landscape phones / short screens */
@media (min-aspect-ratio:4/5) and (max-height:700px) {
    #app { padding:8px; }
    .app-layout { grid-template-columns:minmax(155px,22vw) minmax(0,1fr); gap:10px; }
    .sidebar { gap:8px; }
    .set-select { height:40px; font-size:.95rem; }
    .selected-card {
        max-height:calc((100dvh - 8px - 8px - 40px - 44px - 24px) / 2);
        width:auto; height:100%;
    }
    .create-button { height:44px; font-size:1rem; }
    .main-panel { padding:7px; }
    .top-row { min-height:18px; margin-bottom:4px; }
    .status { font-size:.78rem; }
    .card-grid { gap:10px; }
}

@media (min-width:700px) and (max-aspect-ratio:4/5) {
    .selected-card { height:clamp(145px,19dvh,210px); }
}
@media (max-width:420px) and (max-aspect-ratio:4/5) {
    #app { padding:8px; }
    .sidebar { gap:8px; }
    .selected-card { height:clamp(100px,17dvh,140px); }
    .create-button { height:44px; font-size:1.05rem; }
    .card-grid { gap:10px; }
}

@media (max-width:600px) {
    .card-grid {
        grid-template-columns:repeat(2, minmax(0,1fr));
        gap:10px;
    }
}


/* Upload status modal */
.modal-overlay {
    position:fixed;
    inset:0;
    z-index:1000;
    display:grid;
    place-items:center;
    padding:24px;
    background:rgba(0,0,0,.34);
    backdrop-filter:blur(2px);
}
.modal-panel {
    width:min(410px,100%);
    padding:28px;
    border:1px solid rgba(70,70,70,.35);
    border-radius:16px;
    background:rgba(255,255,255,.97);
    box-shadow:0 16px 45px rgba(0,0,0,.24);
    text-align:center;
}
.modal-panel h2 {
    margin:0 0 12px;
    font-size:1.55rem;
}
.modal-message {
    min-height:2.6em;
    display:grid;
    place-items:center;
    margin-bottom:18px;
    color:#555;
    line-height:1.4;
}
.modal-spinner {
    width:34px;
    height:34px;
    margin:2px auto 16px;
    border:4px solid rgba(0,0,0,.14);
    border-top-color:#444;
    border-radius:50%;
    animation:modal-spin .8s linear infinite;
}
@keyframes modal-spin {
    to { transform:rotate(360deg); }
}
.modal-ok {
    min-width:120px;
    height:44px;
    padding:0 22px;
    border:1px solid #777;
    border-radius:9px;
    background:#fff;
    color:#333;
    cursor:pointer;
}
.modal-ok:hover { background:#f3f3f3; }
.modal-ok:disabled { opacity:.45; cursor:not-allowed; }

</style>
</head>
<body>
<div class="version-badge">GCG Pair Creator · v1.1</div>
<section id="password-screen">
  <div class="login-panel">
    <h1>Pair Creator</h1>
    <p>Enter the shared password to continue.</p>
    <div class="password-row">
      <input id="password-input" type="password" autocomplete="current-password" placeholder="Password">
      <button id="password-button" class="primary-button">Enter</button>
    </div>
    <div id="password-message"></div>
  </div>
</section>

<main id="app" class="hidden">
  <div class="app-layout">
    <aside class="sidebar">
      <select id="set-select" class="set-select"></select>
      <div id="selected-1" class="selected-card"></div>
      <div id="selected-2" class="selected-card"></div>
      <button id="create-pair" class="create-button">Create Pair</button>
    </aside>

    <section class="main-panel">
      <div class="top-row"><div id="status" class="status"></div></div>
      <div id="card-grid" class="card-grid"></div>
      <div id="empty-state" class="empty-state hidden">No cards found for this set.</div>
    </section>
  </div>
</main>


<div id="upload-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="upload-modal-title">
  <div class="modal-panel">
    <h2 id="upload-modal-title">Pair Upload</h2>
    <div id="upload-spinner" class="modal-spinner hidden"></div>
    <div id="upload-modal-message" class="modal-message"></div>
    <button id="upload-modal-ok" class="modal-ok">Okay</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://vixudhbgvihtdynhcfey.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zBf__8-D1Tu01z6i8Tg96g_Rx4BL33r";
const PASSWORD_CHECK_PATH = "/functions/v1/check-pair-password";
const CARD_BACK_URL = "images/basic/Card_White.png";

const SETS = [
  { code:"GD01", csvUrl:"data/GD01Pairings.csv", imageFolder:"images/GD01" },
  { code:"GD02", csvUrl:"data/GD02Pairings.csv", imageFolder:"images/GD02" },
  { code:"GD03", csvUrl:"data/GD03Pairings.csv", imageFolder:"images/GD03" },
  { code:"GD04", csvUrl:"data/GD04Pairings.csv", imageFolder:"images/GD04" },
  { code:"GD05", csvUrl:"data/GD05Pairings.csv", imageFolder:"images/GD05" },
  { code:"EB01", csvUrl:"data/EB01Pairings.csv", imageFolder:"images/EB01" }
];

let currentSet = SETS[0];
let cards = [];
let selectedCard1 = null;
let selectedCard2 = null;
let existingPairs = new Set();
let isUploading = false;

const passwordScreen = document.getElementById("password-screen");
const passwordInput = document.getElementById("password-input");
const passwordButton = document.getElementById("password-button");
const passwordMessage = document.getElementById("password-message");
const app = document.getElementById("app");
const setSelect = document.getElementById("set-select");
const cardGrid = document.getElementById("card-grid");
const selected1 = document.getElementById("selected-1");
const selected2 = document.getElementById("selected-2");
const createPairButton = document.getElementById("create-pair");
const status = document.getElementById("status");
const emptyState = document.getElementById("empty-state");
const uploadModal = document.getElementById("upload-modal");
const uploadModalMessage = document.getElementById("upload-modal-message");
const uploadModalOk = document.getElementById("upload-modal-ok");
const uploadSpinner = document.getElementById("upload-spinner");

async function validatePassword() {
  const password = passwordInput.value;
  if (!password) { passwordMessage.textContent = "Enter a password."; return; }
  passwordButton.disabled = true;
  passwordMessage.textContent = "Checking...";
  try {
    const response = await fetch(SUPABASE_URL + PASSWORD_CHECK_PATH, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_PUBLISHABLE_KEY,
        "Authorization":`Bearer ${SUPABASE_PUBLISHABLE_KEY}`
      },
      body:JSON.stringify({password})
    });
    if (!response.ok) throw new Error(`Password check failed: ${response.status}`);
    const result = await response.json();
    if (!result.valid) {
      passwordMessage.textContent = "Incorrect password.";
      passwordButton.disabled = false;
      return;
    }
    passwordMessage.textContent = "";
    passwordScreen.classList.add("hidden");
    app.classList.remove("hidden");
    await initializeApp();
  } catch (error) {
    console.error(error);
    passwordMessage.textContent = "Could not verify password.";
    passwordButton.disabled = false;
  }
}
passwordButton.addEventListener("click", validatePassword);
passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") validatePassword(); });

function parseCSVLine(line) {
  const values = [];
  let current = "";
  let inQuotes = false;
  for (let i=0;i<line.length;i++) {
    const char = line[i];
    const next = line[i+1];
    if (char === '"') {
      if (inQuotes && next === '"') { current += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      values.push(current); current = "";
    } else current += char;
  }
  values.push(current);
  return values.map(v => v.trim());
}
function extractCardId(value) {
  const match = String(value || "").match(/[A-Z]{2}\d{2}-\d{3}/i);
  return match ? match[0].toUpperCase() : "";
}
function removeCardId(value) {
  return String(value || "").replace(/[A-Z]{2}\d{2}-\d{3}/i, "").trim();
}
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
  if (lines.length < 2) return [];
  const result = [];
  for (let i=1;i<lines.length;i++) {
    const cols = parseCSVLine(lines[i]);
    const type = (cols[0] || "").trim();
    const id = extractCardId(cols[1]);
    const name = removeCardId(cols[1]);
    if (!id) continue;
    result.push({id,type,name});
  }
  return result;
}

function normalizePair(card1, card2) {
  return [card1, card2].sort((a,b) => a.localeCompare(b)).join("|");
}
function getImageUrl(card) {
  return currentSet.imageFolder + "/" + card.id + ".png";
}
function clearSelection() {
  selectedCard1 = null;
  selectedCard2 = null;
  renderSelectedCards();
  renderCards();
}
function selectCard(card) {
  if (selectedCard1 && selectedCard1.id === card.id) selectedCard1 = null;
  else if (selectedCard2 && selectedCard2.id === card.id) selectedCard2 = null;
  else if (!selectedCard1) selectedCard1 = card;
  else if (!selectedCard2) selectedCard2 = card;
  renderSelectedCards();
  renderCards();
}

async function loadPairings() {
  const url = `${SUPABASE_URL}/rest/v1/pairings?select=card_1,card_2`;
  const response = await fetch(url, {headers:{
    "apikey":SUPABASE_PUBLISHABLE_KEY,
    "Authorization":`Bearer ${SUPABASE_PUBLISHABLE_KEY}`
  }});
  if (!response.ok) throw new Error("Could not load pairings.");
  const rows = await response.json();
  existingPairs.clear();
  rows.forEach(row => {
    if (row.card_1 && row.card_2) existingPairs.add(normalizePair(row.card_1,row.card_2));
  });
}

function showUploadModal(message, uploading = false) {
  uploadModalMessage.textContent = message;
  uploadSpinner.classList.toggle("hidden", !uploading);
  uploadModalOk.disabled = uploading;
  uploadModal.classList.remove("hidden");
}

function finishUploadModal(message) {
  uploadModalMessage.textContent = message;
  uploadSpinner.classList.add("hidden");
  uploadModalOk.disabled = false;
  uploadModalOk.focus();
}

function closeUploadModal() {
  if (isUploading) return;
  uploadModal.classList.add("hidden");
}

async function createPair() {
  if (isUploading) return;

  if (!selectedCard1 || !selectedCard2) {
    showUploadModal("Select two cards first.");
    return;
  }

  const card1 = selectedCard1.id;
  const card2 = selectedCard2.id;
  const key = normalizePair(card1, card2);

  if (existingPairs.has(key)) {
    showUploadModal("Pair already exists.");
    return;
  }

  isUploading = true;
  createPairButton.disabled = true;
  showUploadModal(`Uploading ${card1} + ${card2}...`, true);

  const ordered = [card1, card2].sort((a,b)=>a.localeCompare(b));

  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/pairings`, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_PUBLISHABLE_KEY,
        "Authorization":`Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        "Prefer":"return=minimal"
      },
      body:JSON.stringify([{card_1:ordered[0], card_2:ordered[1]}])
    });

    if (!response.ok) {
      throw new Error(`Upload failed: ${response.status}`);
    }

    existingPairs.add(key);
    clearSelection();
    finishUploadModal("Pair uploaded!");
  } catch (error) {
    console.error(error);
    finishUploadModal("Upload failed. Please try again.");
  } finally {
    isUploading = false;
    createPairButton.disabled = false;
  }
}

function setStatus(message) { status.textContent = message; }
function renderSelectedCard(container, card) {
  const src = card ? getImageUrl(card) : CARD_BACK_URL;
  const alt = card ? card.id : "Card back";
  container.innerHTML = `<img src="${src}" alt="${alt}" draggable="false">`;
}
function renderSelectedCards() {
  renderSelectedCard(selected1, selectedCard1);
  renderSelectedCard(selected2, selectedCard2);
}
function renderCards() {
  cardGrid.innerHTML = "";
  emptyState.classList.toggle("hidden", cards.length > 0);
  cards.forEach(card => {
    const button = document.createElement("button");
    button.className = "card-button";
    if (selectedCard1 && selectedCard1.id === card.id) button.classList.add("selected-1");
    if (selectedCard2 && selectedCard2.id === card.id) button.classList.add("selected-2");
    button.innerHTML = `<img src="${getImageUrl(card)}" alt="${card.id}" loading="lazy" draggable="false">`;
    button.addEventListener("click", () => {
      if (Date.now() < suppressCardClickUntil) return;
      selectCard(card);
    });
    cardGrid.appendChild(button);
  });
}

async function loadSet(code) {
  const set = SETS.find(item => item.code === code);
  if (!set) return;
  currentSet = set;
  selectedCard1 = null;
  selectedCard2 = null;
  renderSelectedCards();
  setStatus(`Loading ${set.code}...`);
  const response = await fetch(set.csvUrl);
  if (!response.ok) {
    cards = [];
    renderCards();
    setStatus(`Could not load ${set.csvUrl}`);
    return;
  }
  const csv = await response.text();
  cards = parseCSV(csv);
  cardGrid.scrollTop = 0;
  renderCards();
  setStatus(`${cards.length} cards loaded.`);
}

async function initializeApp() {
  setSelect.innerHTML = "";
  SETS.forEach(set => {
    const option = document.createElement("option");
    option.value = set.code;
    option.textContent = set.code;
    setSelect.appendChild(option);
  });
  renderSelectedCards();
  setStatus("Loading pair database...");
  try { await loadPairings(); }
  catch (error) { console.error(error); setStatus("Could not load existing pairings."); }
  await loadSet(setSelect.value);
}

let dragActive = false;
let dragMoved = false;
let dragStartY = 0;
let dragStartScrollTop = 0;
let suppressCardClickUntil = 0;

cardGrid.addEventListener("pointerdown", event => {
  if (event.pointerType !== "mouse" || event.button !== 0) return;
  dragActive = true;
  dragMoved = false;
  dragStartY = event.clientY;
  dragStartScrollTop = cardGrid.scrollTop;
  cardGrid.setPointerCapture(event.pointerId);
});
cardGrid.addEventListener("pointermove", event => {
  if (!dragActive || event.pointerType !== "mouse") return;
  const deltaY = event.clientY - dragStartY;
  if (Math.abs(deltaY) > 4) {
    dragMoved = true;
    cardGrid.classList.add("dragging");
    event.preventDefault();
  }
  if (dragMoved) cardGrid.scrollTop = dragStartScrollTop - deltaY;
});
function finishDrag(event) {
  if (!dragActive) return;
  dragActive = false;
  cardGrid.classList.remove("dragging");
  if (dragMoved) suppressCardClickUntil = Date.now() + 200;
  try { cardGrid.releasePointerCapture(event.pointerId); } catch (_) {}
}
cardGrid.addEventListener("pointerup", finishDrag);
cardGrid.addEventListener("pointercancel", finishDrag);

setSelect.addEventListener("change", () => loadSet(setSelect.value));
createPairButton.addEventListener("click", createPair);
uploadModalOk.addEventListener("click", closeUploadModal);
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !uploadModal.classList.contains("hidden") && !isUploading) {
    closeUploadModal();
  }
});
</script>
</body>
</html>
