<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masaya - GCG Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        .button-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            background: #4a6cff;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background: #6f8cff;
            transform: translateY(-3px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Masa's GCG Hub</h1>

        <div class="button-row">
            <a href="https://masayatodoroki.com/gd04reveals" class="btn">GD04 Full List</a>
            <a href="https://masayatodoroki.com/gd04-AASP" class="btn">GD04 AA-SP</a>
            <a href="https://masayatodoroki.com/GD04_AAPairings" class="btn">GD04 AA Pairings</a>
            <a href="https://masayatodoroki.com/GD03_AAPairings" class="btn">GD03 AA Pairings</a>
        </div>
    </div>

</body>
</html>
