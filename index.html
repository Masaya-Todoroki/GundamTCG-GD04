<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masaya - GCG Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            padding: 50px;
            border-radius: 24px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        .subtitle {
            margin: -20px 0 0;
            opacity: 0.75;
            font-size: 1rem;
        }

        .button-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            background: linear-gradient(180deg, #5f82ff, #4a6cff);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.25s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        }

            .btn:hover {
                transform: translateY(-4px) scale(1.03);
                box-shadow: 0 10px 25px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
            }

            .btn:active {
                transform: translateY(0) scale(1);
            }

        @media (max-width: 600px) {
            .container {
                padding: 35px 25px;
                width: 100%;
            }

            h1 {
                font-size: 2rem;
            }

            .button-row {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Masa's GCG Hub</h1>

        <p class="subtitle">
            Gundam Card Game resources, pairings, and collection tools.
        </p>

        <div class="button-row">
            <a href="https://masayatodoroki.com/gd04reveals" class="btn">GD04 Full List</a>
            <a href="https://masayatodoroki.com/gd05reveals" class="btn">GD05 Full List</a>
            <a href="https://masayatodoroki.com/gd04-AASP" class="btn">GD04 AA-SP</a>
            <a href="https://masayatodoroki.com/GD04_AAPairings" class="btn">GD04 AA Pairings</a>
            <a href="https://masayatodoroki.com/GD03_AAPairings" class="btn">GD03 AA Pairings</a>
        </div>
    </div>

</body>
</html>
