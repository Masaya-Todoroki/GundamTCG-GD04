<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store Tournament Promos</title>

<style>

body{
    margin:0;
    padding:30px;
    font-family:Arial, Helvetica, sans-serif;
    background:#1a1a1a;
    color:white;
}

h1{
    margin-top:20px;
    text-align:center;
}

h2{
    text-align:center;
    margin-top:40px;
}

h3{
    text-align:center;
}

.backButton{
    display:inline-block;
    padding:10px 18px;
    border-radius:8px;
    background:#333;
    color:white;
    text-decoration:none;
    transition:.2s;
}

.backButton:hover{
    background:#555;
}

#buttonContainer{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:30px 0;
}

#buttonContainer button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2f2f2f;
    color:white;
    font-size:16px;
}

#buttonContainer button:hover{
    background:#4a4a4a;
}

#buttonContainer button.active{
    background:#0d6efd;
}

.promoGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-bottom:50px;
}

.promoGrid img{
    width:100%;
    border-radius:10px;
    transition:.2s;
}

.promoGrid img:hover{
    transform:scale(1.03);
}

</style>

</head>

<body>

<a class="backButton" href="https://masayatodoroki.com">
← Back to masayatodoroki.com
</a>

<h1>Store Tournament Promos</h1>

<div id="buttonContainer"></div>

<div id="content"></div>

<script>

//======================================
// ONLY EDIT THIS
//======================================

const seasons = [
    "2025-season-1",
    "2025-season-2",
    "2025-season-3",
    "2025-season-4",
    "2026-season-1"
];

//======================================

const buttonContainer=document.getElementById("buttonContainer");
const content=document.getElementById("content");

function formatName(folder){

    const parts=folder.split("-");

    return `${parts[0]} Season ${parts[2]}`;

}

function showSeason(folder){

    document.querySelectorAll("#buttonContainer button").forEach(btn=>{

        btn.classList.remove("active");

        if(btn.dataset.folder===folder)
            btn.classList.add("active");

    });

    let html="";

    html+=`<h2>${formatName(folder)}</h2>`;

    html+=`<h3>Participation Promos</h3>`;

    html+=`<div class="promoGrid">`;

    for(let i=1;i<=8;i++){

        let num=i.toString().padStart(3,"0");

        html+=`
        <img
            src="images/store-promos/${folder}/${num}.png"
            loading="lazy"
            alt="${num}">
        `;

    }

    html+=`</div>`;

    html+=`<h3>Winner Promos</h3>`;

    html+=`<div class="promoGrid">`;

    for(let i=1;i<=8;i++){

        let num=i.toString().padStart(3,"0");

        html+=`
        <img
            src="images/store-promos/${folder}/${num}w.png"
            loading="lazy"
            alt="${num} Winner">
        `;

    }

    html+=`</div>`;

    content.innerHTML=html;

}

seasons.forEach(folder=>{

    const button=document.createElement("button");

    button.dataset.folder=folder;

    button.textContent=formatName(folder);

    button.onclick=()=>showSeason(folder);

    buttonContainer.appendChild(button);

});

// Show newest season automatically
showSeason(seasons[seasons.length-1]);

</script>

</body>
</html>
