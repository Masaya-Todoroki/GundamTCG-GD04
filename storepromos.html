<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Store Tournament Promos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #101010;
            color: #ffffff;
        }

        /* ==============================
           HEADER
        ============================== */

        .page-header {
            padding: 18px 20px 24px;
            text-align: center;
            background-color: #1b1b1b;
            border-bottom: 1px solid #343434;
        }

            .page-header h1 {
                margin: 0;
                font-size: clamp(28px, 4vw, 42px);
                font-weight: 700;
            }

        .page-description {
            margin: 4px 0 18px;
            font-size: clamp(15px, 2vw, 19px);
            font-weight: 600;
        }

        /* ==============================
           NAVIGATION BUTTONS
        ============================== */

        .season-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-button {
            min-width: 86px;
            padding: 11px 20px;
            border: 1px solid #444444;
            border-radius: 999px;
            background-color: #292929;
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }

            .nav-button:hover {
                background-color: #3a3a3a;
                border-color: #666666;
                transform: translateY(-1px);
            }

            .nav-button.active {
                background-color: #f4f4f4;
                border-color: #f4f4f4;
                color: #111111;
            }

        /* ==============================
           MAIN CONTENT
        ============================== */

        main {
            width: 100%;
            padding: 24px 3%;
        }

        .season-title {
            margin: 0 0 24px;
            text-align: center;
            font-size: clamp(24px, 3vw, 34px);
        }

        .promo-section {
            margin-bottom: 46px;
        }

            .promo-section h2 {
                margin: 0 0 18px;
                text-align: center;
                font-size: clamp(20px, 2.5vw, 28px);
            }

        /* ==============================
           CARD GRID
        ============================== */

        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .promo-card {
            overflow: hidden;
            border: 1px solid #383838;
            border-radius: 13px;
            background-color: #1b1b1b;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

            .promo-card:hover {
                transform: translateY(-3px);
                border-color: #666666;
            }

            .promo-card img {
                display: block;
                width: 100%;
                height: auto;
            }

            /* ==============================
           IMAGE VIEWER
        ============================== */

            .promo-card button {
                display: block;
                width: 100%;
                padding: 0;
                border: 0;
                background: none;
                cursor: pointer;
            }

        .image-viewer {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: rgba(0, 0, 0, 0.9);
        }

            .image-viewer.open {
                display: flex;
            }

            .image-viewer img {
                display: block;
                max-width: min(92vw, 650px);
                max-height: 92vh;
                border-radius: 10px;
            }

        .viewer-close {
            position: fixed;
            top: 15px;
            right: 20px;
            border: 0;
            background: none;
            color: #ffffff;
            font-size: 44px;
            line-height: 1;
            cursor: pointer;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {
            .page-header {
                padding: 16px 12px 20px;
            }

            .page-description {
                margin-bottom: 16px;
            }

            .season-buttons {
                gap: 8px;
            }

            .nav-button {
                min-width: 72px;
                padding: 9px 14px;
                font-size: 14px;
            }

            main {
                padding: 20px 12px;
            }

            .promo-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .promo-card {
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>

    <header class="page-header">
        <h1>Store Tournament Promos</h1>

        <p class="page-description">
            Participation and winner cards from each Store Tournament season
        </p>

        <nav id="seasonButtons"
             class="season-buttons"
             aria-label="Store Tournament seasons">
            <a href="https://masayatodoroki.com"
               class="nav-button">
                Home
            </a>

            <!-- Season buttons are generated automatically -->
        </nav>
    </header>

    <main id="content">
        <!-- Card content is generated automatically -->
    </main>

    <div id="imageViewer"
         class="image-viewer"
         aria-hidden="true">
        <button id="viewerClose"
                class="viewer-close"
                type="button"
                aria-label="Close image">
            &times;
        </button>

        <img id="viewerImage"
             src=""
             alt="">
    </div>

    <script>
        /*
        ============================================
        ONLY EDIT THIS LIST WHEN ADDING NEW SEASONS
        ============================================
        */

        const seasons = [
            "2025-season-1",
            "2025-season-2",
            "2026-season-1",
            "2026-season-2",
            "2026-season-3"
        ];

        /*
        ============================================
        PAGE SETTINGS
        ============================================
        */

        const cardsPerSeason = 8;

        const imageRoot = "images/store-promos";

        const seasonButtons =
            document.getElementById("seasonButtons");

        const content =
            document.getElementById("content");

        const imageViewer =
            document.getElementById("imageViewer");

        const viewerImage =
            document.getElementById("viewerImage");

        const viewerClose =
            document.getElementById("viewerClose");

        /*
        ============================================
        FORMAT SEASON NAMES
        ============================================
        */

        function getSeasonDetails(folder) {
            const match = folder.match(
                /^(\d{4})-season-(\d+)$/
            );

            if (!match) {
                return {
                    buttonName: folder,
                    fullName: folder
                };
            }

            const year = match[1];
            const season = match[2];

            return {
                buttonName: `${year} S${season}`,
                fullName:
                    `Store Tournament ${year} Season ${season}`
            };
        }

        /*
        ============================================
        CREATE A SINGLE CARD
        ============================================
        */

        function createCard(
            folder,
            number,
            isWinner
        ) {
            const suffix = isWinner ? "w" : "";

            const fileName =
                `${number}${suffix}.png`;

            const imagePath =
                `${imageRoot}/${folder}/${fileName}`;

            const cardLabel = isWinner
                ? `${number} winner promo`
                : `${number} participation promo`;

            return `
                    <article class="promo-card">
                        <button
                            type="button"
                            class="card-image-button"
                            data-image="${imagePath}"
                            data-alt="${cardLabel}"
                            aria-label="View ${cardLabel}"
                        >
                            <img
                                src="${imagePath}"
                                alt="${cardLabel}"
                                loading="lazy"
                            >
                        </button>
                    </article>
                `;
        }

        /*
        ============================================
        CREATE CARD GRID
        ============================================
        */

        function createCardGrid(
            folder,
            isWinner
        ) {
            let cards = "";

            for (
                let i = 1;
                i <= cardsPerSeason;
                i++
            ) {
                const number =
                    String(i).padStart(3, "0");

                cards += createCard(
                    folder,
                    number,
                    isWinner
                );
            }

            return cards;
        }

        /*
        ============================================
        DISPLAY SELECTED SEASON
        ============================================
        */

        function showSeason(folder) {
            const details =
                getSeasonDetails(folder);

            document
                .querySelectorAll(
                    ".season-button"
                )
                .forEach(button => {
                    const isActive =
                        button.dataset.folder === folder;

                    button.classList.toggle(
                        "active",
                        isActive
                    );

                    button.setAttribute(
                        "aria-current",
                        isActive ? "page" : "false"
                    );
                });

            content.innerHTML = `
                    <h2 class="season-title">
                        ${details.fullName}
                    </h2>

                    <section class="promo-section">
                        <h2>Participation Promos</h2>

                        <div class="promo-grid">
                            ${createCardGrid(
                folder,
                false
            )}
                        </div>
                    </section>

                    <section class="promo-section">
                        <h2>Winner Promos</h2>

                        <div class="promo-grid">
                            ${createCardGrid(
                folder,
                true
            )}
                        </div>
                    </section>
                `;

            attachImageViewerButtons();
        }

        /*
        ============================================
        CREATE SEASON BUTTONS
        ============================================
        */

        function createSeasonButtons() {
            seasons.forEach(folder => {
                const details =
                    getSeasonDetails(folder);

                const button =
                    document.createElement("button");

                button.type = "button";

                button.className =
                    "nav-button season-button";

                button.dataset.folder =
                    folder;

                button.textContent =
                    details.buttonName;

                button.addEventListener(
                    "click",
                    () => showSeason(folder)
                );

                seasonButtons.appendChild(
                    button
                );
            });
        }

        /*
        ============================================
        IMAGE VIEWER
        ============================================
        */

        function attachImageViewerButtons() {
            document
                .querySelectorAll(
                    ".card-image-button"
                )
                .forEach(button => {
                    button.addEventListener(
                        "click",
                        () => {
                            openImageViewer(
                                button.dataset.image,
                                button.dataset.alt
                            );
                        }
                    );
                });
        }

        function openImageViewer(
            imagePath,
            imageAlt
        ) {
            viewerImage.src = imagePath;
            viewerImage.alt = imageAlt;

            imageViewer.classList.add("open");

            imageViewer.setAttribute(
                "aria-hidden",
                "false"
            );

            document.body.style.overflow =
                "hidden";
        }

        function closeImageViewer() {
            imageViewer.classList.remove("open");

            imageViewer.setAttribute(
                "aria-hidden",
                "true"
            );

            viewerImage.src = "";

            document.body.style.overflow = "";
        }

        viewerClose.addEventListener(
            "click",
            closeImageViewer
        );

        imageViewer.addEventListener(
            "click",
            event => {
                if (
                    event.target === imageViewer
                ) {
                    closeImageViewer();
                }
            }
        );

        document.addEventListener(
            "keydown",
            event => {
                if (
                    event.key === "Escape" &&
                    imageViewer.classList.contains(
                        "open"
                    )
                ) {
                    closeImageViewer();
                }
            }
        );

        /*
        ============================================
        START PAGE
        ============================================
        */

        if (seasons.length > 0) {
            createSeasonButtons();

            // Automatically show the newest season
            showSeason(
                seasons[seasons.length - 1]
            );
        } else {
            content.innerHTML = `
                    <p style="text-align:center;">
                        No Store Tournament seasons have been added.
                    </p>
                `;
        }
    </script>

</body>
</html>
