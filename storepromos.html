<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Store Tournament Promos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding-bottom: 105px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #101010;
            color: #ffffff;
        }

        button,
        a {
            font-family: inherit;
        }

        /* =========================================
           HEADER
        ========================================= */

        .page-header {
            padding: 18px 20px 24px;
            text-align: center;
            background-color: #1b1b1b;
            border-bottom: 1px solid #343434;
        }

            .page-header h1 {
                margin: 0;
                font-size: clamp(28px, 4vw, 42px);
                font-weight: 700;
            }

        .page-description {
            margin: 5px 0 18px;
            font-size: clamp(15px, 2vw, 19px);
            font-weight: 600;
        }

        /* =========================================
           TOP NAVIGATION
        ========================================= */

        .season-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-button {
            min-width: 82px;
            padding: 11px 20px;
            border: 1px solid #444444;
            border-radius: 999px;
            background-color: #292929;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }

            .nav-button:hover {
                background-color: #3a3a3a;
                border-color: #666666;
                transform: translateY(-1px);
            }

            .nav-button.active {
                background-color: #f4f4f4;
                border-color: #f4f4f4;
                color: #111111;
            }

        /* =========================================
           MAIN CONTENT
        ========================================= */

        main {
            width: 100%;
            padding: 26px 3%;
        }

        .season-title {
            margin: 0 0 8px;
            text-align: center;
            font-size: clamp(25px, 3vw, 35px);
        }

        .category-title {
            margin: 0 0 24px;
            text-align: center;
            color: #cfcfcf;
            font-size: clamp(18px, 2vw, 24px);
        }

        /* =========================================
           CARD GRID
        ========================================= */

        .promo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .promo-card {
            overflow: hidden;
            border: 1px solid #383838;
            border-radius: 13px;
            background-color: #1b1b1b;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

            .promo-card:hover {
                transform: translateY(-3px);
                border-color: #666666;
            }

        .card-image-button {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
        }

        .promo-card img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* =========================================
           FIXED BOTTOM TOGGLE
        ========================================= */

        .bottom-toggle-wrapper {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 900;
            display: flex;
            justify-content: center;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
            pointer-events: none;
        }

        .bottom-toggle {
            display: flex;
            width: min(390px, calc(100vw - 24px));
            overflow: hidden;
            border: 1px solid #4a4a4a;
            border-radius: 999px;
            background-color: rgba(35, 35, 35, 0.92);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            pointer-events: auto;
        }

        .type-button {
            flex: 1;
            padding: 14px 18px;
            border: 0;
            background: transparent;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

            .type-button:hover {
                background-color: rgba(255, 255, 255, 0.08);
            }

            .type-button.active {
                background-color: #f4f4f4;
                color: #111111;
            }

        /* =========================================
           IMAGE VIEWER
        ========================================= */

        .image-viewer {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: rgba(0, 0, 0, 0.92);
        }

            .image-viewer.open {
                display: flex;
            }

            .image-viewer img {
                display: block;
                max-width: min(92vw, 650px);
                max-height: 92vh;
                border-radius: 10px;
            }

        .viewer-close {
            position: fixed;
            top: 14px;
            right: 20px;
            padding: 0;
            border: 0;
            background: none;
            color: #ffffff;
            font-size: 46px;
            line-height: 1;
            cursor: pointer;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {
            body {
                padding-bottom: 95px;
            }

            .page-header {
                padding: 16px 12px 20px;
            }

            .page-description {
                margin-bottom: 16px;
            }

            .season-buttons {
                gap: 8px;
            }

            .nav-button {
                min-width: 68px;
                padding: 9px 14px;
                font-size: 14px;
            }

            main {
                padding: 20px 10px;
            }

            .promo-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .promo-card {
                border-radius: 8px;
            }

            .type-button {
                padding: 13px 10px;
                font-size: 15px;
            }
        }

        @media (max-width: 370px) {
            .nav-button {
                padding: 8px 11px;
                font-size: 13px;
            }

            .promo-grid {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <header class="page-header">
        <h1>Store Tournament Promos</h1>

        <p class="page-description">
            Participation and winner cards from each Store Tournament season
        </p>

        <nav id="seasonButtons"
             class="season-buttons"
             aria-label="Store Tournament seasons">
            <a href="https://masayatodoroki.com"
               class="nav-button">
                Home
            </a>

            <!-- Season buttons are generated here -->
        </nav>
    </header>

    <main id="content">
        <!-- Cards are generated here -->
    </main>

    <div class="bottom-toggle-wrapper">
        <div class="bottom-toggle"
             role="group"
             aria-label="Promo card type">
            <button id="participationButton"
                    class="type-button active"
                    type="button"
                    data-type="participation">
                Participation
            </button>

            <button id="winnerButton"
                    class="type-button"
                    type="button"
                    data-type="winner">
                Winner
            </button>
        </div>
    </div>

    <div id="imageViewer"
         class="image-viewer"
         aria-hidden="true">
        <button id="viewerClose"
                class="viewer-close"
                type="button"
                aria-label="Close image">
            &times;
        </button>

        <img id="viewerImage"
             src=""
             alt="">
    </div>

    <script>
        /*
        ============================================
        ONLY EDIT THIS LIST WHEN ADDING NEW SEASONS
        ============================================
        */

        const seasons = [
            "2025-season-1",
            "2025-season-2",
            "2026-season-1",
            "2026-season-2",
            "2026-season-3"
        ];

        /*
        ============================================
        SETTINGS
        ============================================
        */

        const cardsPerSeason = 8;

        const imageRoot = "images/store-promos";

        let selectedSeason =
            seasons[seasons.length - 1];

        let selectedType =
            "participation";

        /*
        ============================================
        ELEMENTS
        ============================================
        */

        const seasonButtons =
            document.getElementById("seasonButtons");

        const content =
            document.getElementById("content");

        const participationButton =
            document.getElementById(
                "participationButton"
            );

        const winnerButton =
            document.getElementById(
                "winnerButton"
            );

        const imageViewer =
            document.getElementById("imageViewer");

        const viewerImage =
            document.getElementById("viewerImage");

        const viewerClose =
            document.getElementById("viewerClose");

        /*
        ============================================
        SEASON NAMES
        ============================================
        */

        function getSeasonDetails(folder) {
            const match = folder.match(
                /^(\d{4})-season-(\d+)$/
            );

            if (!match) {
                return {
                    buttonName: folder,
                    fullName: folder
                };
            }

            const year = match[1];
            const season = match[2];

            return {
                buttonName: `${year} S${season}`,
                fullName:
                    `Store Tournament ${year} Season ${season}`
            };
        }

        /*
        ============================================
        CREATE CARD
        ============================================
        */

        function createCard(
            folder,
            number,
            isWinner
        ) {
            const suffix =
                isWinner ? "w" : "";

            const fileName =
                `${number}${suffix}.png`;

            const imagePath =
                `${imageRoot}/${folder}/${fileName}`;

            const cardLabel = isWinner
                ? `${number} winner promo`
                : `${number} participation promo`;

            return `
                    <article class="promo-card">
                        <button
                            type="button"
                            class="card-image-button"
                            data-image="${imagePath}"
                            data-alt="${cardLabel}"
                            aria-label="View ${cardLabel}"
                        >
                            <img
                                src="${imagePath}"
                                alt="${cardLabel}"
                                loading="lazy"
                            >
                        </button>
                    </article>
                `;
        }

        /*
        ============================================
        CREATE CARD GRID
        ============================================
        */

        function createCardGrid() {
            let cards = "";

            const isWinner =
                selectedType === "winner";

            for (
                let i = 1;
                i <= cardsPerSeason;
                i++
            ) {
                const number =
                    String(i).padStart(3, "0");

                cards += createCard(
                    selectedSeason,
                    number,
                    isWinner
                );
            }

            return cards;
        }

        /*
        ============================================
        RENDER PAGE
        ============================================
        */

        function renderCards() {
            const details =
                getSeasonDetails(selectedSeason);

            const categoryName =
                selectedType === "winner"
                    ? "Winner Promos"
                    : "Participation Promos";

            content.innerHTML = `
                    <h2 class="season-title">
                        ${details.fullName}
                    </h2>

                    <h3 class="category-title">
                        ${categoryName}
                    </h3>

                    <div class="promo-grid">
                        ${createCardGrid()}
                    </div>
                `;

            updateSeasonButtons();
            updateTypeButtons();
            attachImageViewerButtons();
        }

        /*
        ============================================
        SEASON BUTTONS
        ============================================
        */

        function createSeasonButtons() {
            seasons.forEach(folder => {
                const details =
                    getSeasonDetails(folder);

                const button =
                    document.createElement("button");

                button.type = "button";

                button.className =
                    "nav-button season-button";

                button.dataset.folder =
                    folder;

                button.textContent =
                    details.buttonName;

                button.addEventListener(
                    "click",
                    () => {
                        selectedSeason = folder;
                        renderCards();

                        window.scrollTo({
                            top: 0,
                            behavior: "smooth"
                        });
                    }
                );

                seasonButtons.appendChild(
                    button
                );
            });
        }

        function updateSeasonButtons() {
            document
                .querySelectorAll(
                    ".season-button"
                )
                .forEach(button => {
                    const isActive =
                        button.dataset.folder ===
                        selectedSeason;

                    button.classList.toggle(
                        "active",
                        isActive
                    );

                    button.setAttribute(
                        "aria-current",
                        isActive ? "page" : "false"
                    );
                });
        }

        /*
        ============================================
        PARTICIPATION / WINNER TOGGLE
        ============================================
        */

        function setSelectedType(type) {
            selectedType = type;
            renderCards();
        }

        function updateTypeButtons() {
            const participationActive =
                selectedType === "participation";

            participationButton.classList.toggle(
                "active",
                participationActive
            );

            winnerButton.classList.toggle(
                "active",
                !participationActive
            );

            participationButton.setAttribute(
                "aria-pressed",
                participationActive
            );

            winnerButton.setAttribute(
                "aria-pressed",
                !participationActive
            );
        }

        participationButton.addEventListener(
            "click",
            () => {
                setSelectedType("participation");
            }
        );

        winnerButton.addEventListener(
            "click",
            () => {
                setSelectedType("winner");
            }
        );

        /*
        ============================================
        IMAGE VIEWER
        ============================================
        */

        function attachImageViewerButtons() {
            document
                .querySelectorAll(
                    ".card-image-button"
                )
                .forEach(button => {
                    button.addEventListener(
                        "click",
                        () => {
                            openImageViewer(
                                button.dataset.image,
                                button.dataset.alt
                            );
                        }
                    );
                });
        }

        function openImageViewer(
            imagePath,
            imageAlt
        ) {
            viewerImage.src = imagePath;
            viewerImage.alt = imageAlt;

            imageViewer.classList.add("open");

            imageViewer.setAttribute(
                "aria-hidden",
                "false"
            );

            document.body.style.overflow =
                "hidden";
        }

        function closeImageViewer() {
            imageViewer.classList.remove("open");

            imageViewer.setAttribute(
                "aria-hidden",
                "true"
            );

            viewerImage.src = "";
            viewerImage.alt = "";

            document.body.style.overflow = "";
        }

        viewerClose.addEventListener(
            "click",
            closeImageViewer
        );

        imageViewer.addEventListener(
            "click",
            event => {
                if (
                    event.target === imageViewer
                ) {
                    closeImageViewer();
                }
            }
        );

        document.addEventListener(
            "keydown",
            event => {
                if (
                    event.key === "Escape" &&
                    imageViewer.classList.contains(
                        "open"
                    )
                ) {
                    closeImageViewer();
                }
            }
        );

        /*
        ============================================
        START PAGE
        ============================================
        */

        if (seasons.length > 0) {
            createSeasonButtons();
            renderCards();
        } else {
            content.innerHTML = `
                    <p style="text-align:center;">
                        No Store Tournament seasons have been added.
                    </p>
                `;
        }
    </script>

</body>
</html>
